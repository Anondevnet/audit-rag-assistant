name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (offline embeddings)
    runs-on: ubuntu-latest
    env:
      AUDIT_RAG_EMBEDDER: hashing
      AUDIT_RAG_RERANKER: token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke ingest and search
        run: |
          python -m audit_rag ingest --corpus data/corpus --index /tmp/audit-ci.db
          python -m audit_rag search "reentrancy checks-effects-interactions" --index /tmp/audit-ci.db --k 5
