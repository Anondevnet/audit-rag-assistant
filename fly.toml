# Deploy with: fly launch --copy-config --no-deploy   then fly auth login if needed,
# then fly deploy. Do not run these if you have not logged in.
app = "audit-rag-assistant"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AUDIT_RAG_EMBEDDER = "hashing"
  AUDIT_RAG_RERANKER = "token"
  AUDIT_RAG_GENERATOR = "extractive"
  AUDIT_RAG_INDEX = "data/indexes/audit.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
