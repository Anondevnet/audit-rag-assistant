[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-rag-assistant"
version = "0.1.0"
description = "Cited RAG assistant over a license-cleared smart-contract audit knowledge base (Milestone 2)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Anondevnet" }]
dependencies = [
  "numpy>=1.26",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
local = ["flashrank>=0.2.0"]

[project.scripts]
audit-rag = "audit_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
